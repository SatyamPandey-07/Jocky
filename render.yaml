services:
  - type: web
    name: jocky-control-plane
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python control-plane/main.py --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONPATH
        value: "."
